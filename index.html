<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Wedding Seat Finder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #5b4636;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      position: relative;
      background: #f7efe8;
      min-height: 100dvh;
    }

    .bg-image {
      position: fixed;
      inset: 0;
      background-image: url("WJ_JL_Image.jpeg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transform: scale(1.04);
      filter: blur(5px);
      z-index: -3;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255, 250, 245, 0.25), rgba(255, 250, 245, 0.52)),
        rgba(255, 248, 244, 0.10);
      z-index: -2;
    }

    .bg-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(120, 90, 60, 0.08) 100%
      );
      z-index: -1;
    }

    .page {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 16px calc(40px + env(safe-area-inset-bottom, 0px));
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding-bottom: 8px;
    }

    .card {
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(190, 150, 110, 0.18);
      border-radius: 24px;
      padding: 24px 18px 22px;
      box-shadow: 0 14px 38px rgba(122, 92, 64, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: center;
      position: relative;
      overflow: visible;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(230, 194, 156, 0.22) 0%, rgba(230, 194, 156, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      bottom: -50px;
      left: -50px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(232, 208, 220, 0.20) 0%, rgba(232, 208, 220, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .ring {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #8f6a4e;
      letter-spacing: 0.4px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .subtitle {
      margin: 12px 0 18px;
      font-size: 15px;
      line-height: 1.6;
      color: #7d6757;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #eadacc;
      border-radius: 14px;
      font-size: 16px;
      background: rgba(255, 253, 250, 0.94);
      color: #5b4636;
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus {
      border-color: #bd9264;
      box-shadow: 0 0 0 4px rgba(189, 146, 100, 0.13);
    }

    .search-status {
      min-height: 18px;
      text-align: left;
      font-size: 13px;
      color: #8d7a6a;
      padding-left: 4px;
    }

    #result {
      margin-top: 14px;
      text-align: left;
    }

    .result-box {
      border-radius: 16px;
      padding: 16px;
      line-height: 1.6;
      border: 1px solid #eadacc;
      background: rgba(255, 250, 246, 0.92);
      color: #5b4636;
    }

    .result-box.error {
      background: rgba(255, 248, 248, 0.95);
      border-color: #eed3d3;
      color: #8a5555;
    }

    .result-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #8f6a4e;
    }

    .result-list {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;
    }

    .result-item {
      border: 1px solid #efdfd2;
      background: rgba(255, 253, 251, 0.96);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .guest-name {
      font-weight: 700;
      color: #5b4636;
      margin-bottom: 4px;
    }

    .table-line {
      color: #715b4a;
      font-size: 15px;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #8d7a6a;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 13px;
      color: #9b897b;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .page {
        min-height: auto;
        padding: 14px 12px calc(28px + env(safe-area-inset-bottom, 0px));
      }

      .card {
        padding: 20px 15px 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 14px;
      }

      .bg-image {
        filter: blur(4px);
        transform: scale(1.03);
      }

      .result-item {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="bg-vignette"></div>

  <div class="page">
    <div class="container">
      <div class="card">
        <div class="content">
          <div class="ring">💍</div>
          <h1>Find Your Seat</h1>
          <p class="subtitle">
            Welcome to our wedding celebration.<br />
            Start typing your name to find your table.
          </p>

          <div class="input-group">
            <input
              type="text"
              id="guestName"
              placeholder="Enter your name"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="words"
              spellcheck="false"
            />
            <div id="searchStatus" class="search-status"></div>
          </div>

          <div id="result"></div>

          <div class="footer-note">
            We're so happy to celebrate this special day with you.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const GUEST_FILE = "WJL_Wedding_Guest.xlsx";
    const SHEET_NAME = "Guests";

    const guestInput = document.getElementById("guestName");
    const resultDiv = document.getElementById("result");
    const searchStatus = document.getElementById("searchStatus");

    let guests = [];
    let guestDataLoaded = false;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeName(name) {
      return String(name || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function levenshteinDistance(a, b) {
      const rows = a.length + 1;
      const cols = b.length + 1;
      const matrix = Array.from({ length: rows }, () => Array(cols).fill(0));

      for (let i = 0; i < rows; i += 1) {
        matrix[i][0] = i;
      }

      for (let j = 0; j < cols; j += 1) {
        matrix[0][j] = j;
      }

      for (let i = 1; i < rows; i += 1) {
        for (let j = 1; j < cols; j += 1) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }

      return matrix[a.length][b.length];
    }

    function getMatchScore(query, guestName) {
      const normalizedGuest = normalizeName(guestName);

      if (!normalizedGuest) return 0;
      if (normalizedGuest === query) return 100;
      if (normalizedGuest.startsWith(query)) return 80;
      if (normalizedGuest.includes(query)) return 60;

      const guestWords = normalizedGuest.split(" ");
      const queryWords = query.split(" ").filter(Boolean);
      const guestJoined = guestWords.join("");
      const queryJoined = queryWords.join("");

      if (!queryWords.length) return 0;

      const alignedWordPrefixCount = queryWords.filter((queryWord, index) => {
        const guestWord = guestWords[index];
        return guestWord && guestWord.startsWith(queryWord);
      }).length;

      if (alignedWordPrefixCount === queryWords.length) {
        return 70 + Math.min(9, queryWords.length);
      }

      const allWordsMatchStart =
        queryWords.length > 0 &&
        queryWords.every((queryWord) =>
          guestWords.some((guestWord) => guestWord.startsWith(queryWord))
        );

      if (allWordsMatchStart) return 50;

      const alignedWordContainsCount = queryWords.filter((queryWord, index) => {
        const guestWord = guestWords[index];
        return guestWord && guestWord.includes(queryWord);
      }).length;

      if (alignedWordContainsCount === queryWords.length) {
        return 45 + Math.min(9, queryWords.length);
      }

      const anyWordContains = queryWords.some((queryWord) =>
        guestWords.some((guestWord) => guestWord.includes(queryWord))
      );

      const compactDistance = levenshteinDistance(queryJoined, guestJoined);
      const maxCompactLength = Math.max(queryJoined.length, guestJoined.length);
      const compactSimilarity =
        maxCompactLength > 0 ? 1 - compactDistance / maxCompactLength : 0;

      if (queryWords.length > 1 && compactSimilarity >= 0.7) {
        return 35 + Math.round(compactSimilarity * 10);
      }

      if (anyWordContains) return 30;

      return 0;
    }

    function findMatches(name) {
      const query = normalizeName(name);

      if (!query) {
        return [];
      }

      return guests
        .map((guest) => ({
          guestName: String(guest.guestName || "").trim(),
          table: String(guest.table || "").trim(),
          score: getMatchScore(query, guest.guestName)
        }))
        .filter((guest) => guest.guestName && guest.score > 0)
        .sort((a, b) => b.score - a.score || a.guestName.localeCompare(b.guestName));
    }

    function renderIdle() {
      searchStatus.textContent = "";
      resultDiv.innerHTML = "";
    }

    function renderLoadingData() {
      searchStatus.textContent = "Loading guest list...";
      resultDiv.innerHTML = `
        <div class="result-box">
          Loading guest list...
        </div>
      `;
    }

    function renderMissingData() {
      searchStatus.textContent = "";
      resultDiv.innerHTML = `
        <div class="result-box error">
          We couldn't load the guest list from <strong>${escapeHtml(GUEST_FILE)}</strong>.<br>
          Please keep the Excel file in the same folder and open this page through a hosted site or local web server.
        </div>
      `;
    }

    function renderNoResult() {
      searchStatus.textContent = "";
      resultDiv.innerHTML = `
        <div class="result-box error">
          Sorry, we couldn't find a matching name.<br>
          Please try another spelling or check with the reception team.
        </div>
      `;
    }

    function renderError() {
      searchStatus.textContent = "";
      resultDiv.innerHTML = `
        <div class="result-box error">
          Something went wrong. Please try again shortly.
        </div>
      `;
    }

    function renderSingle(guest) {
      searchStatus.textContent = "";
      resultDiv.innerHTML = `
        <div class="result-box">
          <div class="result-title">Welcome, ${escapeHtml(guest.guestName)}</div>
          <div>Your table is <strong>Table ${escapeHtml(guest.table)}</strong></div>
        </div>
      `;
    }

    function renderMultiple(results) {
      searchStatus.textContent = `${results.length} match${results.length > 1 ? "es" : ""} found`;

      const items = results.map((guest, index) => `
        <li class="result-item">
          <div class="guest-name">${index + 1}) ${escapeHtml(guest.guestName)}</div>
          <div class="table-line">Table <strong>${escapeHtml(guest.table)}</strong></div>
        </li>
      `).join("");

      resultDiv.innerHTML = `
        <div class="result-box">
          <div class="result-title">We found multiple matches</div>
          <div>Please look for your name below:</div>
          <ul class="result-list">${items}</ul>
          <div class="hint">Tip: type more of your full name for a narrower result.</div>
        </div>
      `;
    }

    function searchGuest(name) {
      const trimmed = String(name || "").trim();

      if (!guestDataLoaded) {
        renderLoadingData();
        return;
      }

      if (!trimmed) {
        renderIdle();
        return;
      }

      if (!Array.isArray(guests) || guests.length === 0) {
        renderMissingData();
        return;
      }

      try {
        const matches = findMatches(trimmed);
        const queryWords = normalizeName(trimmed).split(" ").filter(Boolean);

        if (matches.length === 0) {
          renderNoResult();
          return;
        }

        if (queryWords.length > 1 && matches[0].score >= 70) {
          const topMatches = matches.filter(
            (match) => matches[0].score - match.score <= 5
          );

          if (topMatches.length === 1) {
            renderSingle(matches[0]);
            return;
          }

          renderMultiple(topMatches);
          return;
        }

        if (matches.length === 1) {
          renderSingle(matches[0]);
          return;
        }

        renderMultiple(matches);
      } catch (error) {
        renderError();
        console.error(error);
      }
    }

    async function loadGuestData() {
      renderLoadingData();

      try {
        const response = await fetch(GUEST_FILE);

        if (!response.ok) {
          throw new Error(`Failed to fetch ${GUEST_FILE}: ${response.status}`);
        }

        const fileData = await response.arrayBuffer();
        const workbook = XLSX.read(fileData, { type: "array" });
        const worksheet =
          workbook.Sheets[SHEET_NAME] ||
          workbook.Sheets[workbook.SheetNames[0]];

        if (!worksheet) {
          throw new Error("No worksheet found in workbook");
        }

        const rows = XLSX.utils.sheet_to_json(worksheet, {
          header: 1,
          defval: ""
        });

        guests = rows
          .slice(1)
          .map((row) => ({
            guestName: String(row[0] || "").trim(),
            table: String(row[1] || "").trim()
          }))
          .filter((guest) => guest.guestName);

        guestDataLoaded = true;

        if (guestInput.value.trim()) {
          searchGuest(guestInput.value);
          return;
        }

        renderIdle();
      } catch (error) {
        guests = [];
        guestDataLoaded = true;
        renderMissingData();
        console.error(error);
      }
    }

    guestInput.addEventListener("input", function () {
      searchGuest(this.value);
    });

    loadGuestData();
  </script>
</body>
</html>
