<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Seat Finder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #5b4636;
    }

    body {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow: hidden;
      background: #f7efe8;
    }

    /* Blurred photo background */
    .bg-image {
      position: fixed;
      inset: 0;
      background-image: url("WJ_JL_Image.jpeg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transform: scale(1.08);
      filter: blur(12px);
      z-index: -3;
    }

    /* Soft overlay for readability */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255, 250, 245, 0.45), rgba(255, 250, 245, 0.72)),
        rgba(255, 248, 244, 0.22);
      z-index: -2;
    }

    /* Optional extra vignette */
    .bg-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, rgba(120, 90, 60, 0.10) 100%);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(190, 150, 110, 0.18);
      border-radius: 26px;
      padding: 30px 22px;
      box-shadow: 0 14px 38px rgba(122, 92, 64, 0.16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(230, 194, 156, 0.25) 0%, rgba(230, 194, 156, 0) 70%);
      border-radius: 50%;
    }

    .card::after {
      content: "";
      position: absolute;
      bottom: -50px;
      left: -50px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(232, 208, 220, 0.24) 0%, rgba(232, 208, 220, 0) 70%);
      border-radius: 50%;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .ring {
      font-size: 34px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #8f6a4e;
      letter-spacing: 0.4px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .subtitle {
      margin: 12px 0 22px;
      font-size: 15px;
      line-height: 1.6;
      color: #7d6757;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #eadacc;
      border-radius: 14px;
      font-size: 16px;
      background: rgba(255, 253, 250, 0.94);
      color: #5b4636;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #bd9264;
      box-shadow: 0 0 0 4px rgba(189, 146, 100, 0.13);
    }

    button {
      width: 100%;
      padding: 15px 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #c8a077, #a97b52);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 22px rgba(169, 123, 82, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 22px;
      text-align: left;
    }

    .result-box {
      border-radius: 16px;
      padding: 16px;
      line-height: 1.6;
      border: 1px solid #eadacc;
      background: rgba(255, 250, 246, 0.94);
      color: #5b4636;
    }

    .result-box.error {
      background: rgba(255, 248, 248, 0.95);
      border-color: #eed3d3;
      color: #8a5555;
    }

    .result-box.loading {
      text-align: center;
      color: #8f6a4e;
    }

    .result-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #8f6a4e;
    }

    .result-list {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;
    }

    .result-item {
      border: 1px solid #efdfd2;
      background: rgba(255, 253, 251, 0.96);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .guest-name {
      font-weight: 700;
      color: #5b4636;
      margin-bottom: 4px;
    }

    .table-line {
      color: #715b4a;
      font-size: 15px;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #8d7a6a;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 13px;
      color: #9b897b;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px 18px;
        border-radius: 22px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 14px;
      }

      .bg-image {
        filter: blur(10px);
        transform: scale(1.1);
      }
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="bg-vignette"></div>

  <div class="container">
    <div class="card">
      <div class="content">
        <div class="ring">💍</div>
        <h1>Find Your Seat</h1>
        <p class="subtitle">
          Welcome to our wedding celebration.<br />
          Enter your name below to find your table.
        </p>

        <div class="input-group">
          <input
            type="text"
            id="guestName"
            placeholder="Enter your name"
            onkeydown="if(event.key === 'Enter') findSeat()"
          />
          <button onclick="findSeat()">Search</button>
        </div>

        <div id="result"></div>

        <div class="footer-note">
          We’re so happy to celebrate this special day with you.
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxNdUzHxX_1k2iDz84401Nbg3mOf7dFVYC_MEUHuhrxJ5BhNzFS0vqOrjB6rjZlP2K9/exec";

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function findSeat() {
      const name = document.getElementById("guestName").value.trim();
      const resultDiv = document.getElementById("result");

      if (!name) {
        resultDiv.innerHTML = `
          <div class="result-box error">
            Please enter your name first.
          </div>
        `;
        return;
      }

      resultDiv.innerHTML = `
        <div class="result-box loading">
          Searching for your table...
        </div>
      `;

      try {
        const response = await fetch(`${API_URL}?name=${encodeURIComponent(name)}`);
        const data = await response.json();

        if (!data.found || !data.results || data.results.length === 0) {
          resultDiv.innerHTML = `
            <div class="result-box error">
              Sorry, we couldn’t find a matching name.<br>
              Please try another spelling or check with the reception team.
            </div>
          `;
          return;
        }

        if (data.results.length === 1) {
          const guest = data.results[0];
          resultDiv.innerHTML = `
            <div class="result-box">
              <div class="result-title">Welcome, ${escapeHtml(guest.guestName)} ✨</div>
              <div>Your table is <strong>Table ${escapeHtml(guest.table)}</strong></div>
            </div>
          `;
          return;
        }

        const items = data.results.map((guest, index) => `
          <li class="result-item">
            <div class="guest-name">${index + 1}) ${escapeHtml(guest.guestName)}</div>
            <div class="table-line">Table <strong>${escapeHtml(guest.table)}</strong></div>
          </li>
        `).join("");

        resultDiv.innerHTML = `
          <div class="result-box">
            <div class="result-title">We found multiple matches</div>
            <div>Please look for your name below:</div>
            <ul class="result-list">${items}</ul>
            <div class="hint">Tip: type more of your full name for a narrower result.</div>
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result-box error">
            Something went wrong. Please try again shortly.
          </div>
        `;
        console.error(error);
      }
    }
  </script>
</body>
</html>
